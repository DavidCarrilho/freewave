
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login e Anúncios</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 360px;
      margin: auto;
      padding: 20px;
      margin-top: 20vh;
      background: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 5px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    .error {
      color: red;
      font-size: 14px;
      text-align: left;
    }

    button {
      width: 100%;
      background: blue;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled {
      background: gray;
      cursor: not-allowed;
    }

    .appbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #333;
      color: white;
      padding: 10px 16px;
      font-size: 18px;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 50px);
      border: none;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container" id="loginForm">
    <h2>Conecte-se</h2>
    <input type="text" id="name" placeholder="Nome completo">
    <div class="error" id="nameError"></div>
    <input type="email" id="email" placeholder="E-mail">
    <div class="error" id="emailError"></div>
    <button onclick="validateAndProceed()">Conectar</button>
  </div>

  <div id="adContainer" class="hidden">
    <div class="appbar">
      <span id="timerText">Aguarde 5s</span>
      <button id="closeButton" class="hidden" onclick="nextAd()">Fechar</button>
    </div>
    <iframe id="adFrame" src=""></iframe>
  </div>

  <script>
    const links = [
      'https://drive.google.com/file/d/1LSmmhD5or0T5SWTZ3GfrWBuRzdJmSiTK/preview',
      'https://www.wikipedia.org',
      'https://bit.ly/infinitecard-mariadecastropp'
    ];

    let currentAd = 0;
    let countdown = 5;
    let countdownInterval;

    function validateAndProceed() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const nameError = document.getElementById('nameError');
      const emailError = document.getElementById('emailError');
      let isValid = true;

      const nameRegex = /^[A-Za-zÀ-ÖØ-öø-ÿ'\s-]+$/;
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!nameRegex.test(name) || name.length < 3) {
        nameError.innerText = "Nome inválido. Deve conter pelo menos 3 letras.";
        isValid = false;
      } else {
        nameError.innerText = "";
      }

      if (!emailRegex.test(email)) {
        emailError.innerText = "E-mail inválido.";
        isValid = false;
      } else {
        emailError.innerText = "";
      }

      if (isValid) {
        enterFullscreen();
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('adContainer').classList.remove('hidden');
        shuffleArray(links);
        loadAd();
      }
    }

    function enterFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function loadAd() {
      const adFrame = document.getElementById('adFrame');
      const timerText = document.getElementById('timerText');
      const closeButton = document.getElementById('closeButton');

      let url = links[currentAd];

      if (url.endsWith('.pdf')) {
        url += '#toolbar=0&navpanes=0&scrollbar=0';
      }

      adFrame.src = url;
      countdown = 5;
      closeButton.classList.add('hidden');
      timerText.textContent = `Aguarde ${countdown}s`;

      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          timerText.textContent = `Aguarde ${countdown}s`;
        } else {
          clearInterval(countdownInterval);
          timerText.textContent = '';
          closeButton.classList.remove('hidden');
        }
      }, 1000);
    }

    function nextAd() {
      currentAd++;
      if (currentAd < links.length) {
        loadAd();
      } else {
        document.getElementById('adFrame').src = '';
        document.getElementById('timerText').textContent = 'Fim dos anúncios';
        document.getElementById('closeButton').classList.add('hidden');
      }
    }
  </script>
</body>

</html>
