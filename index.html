<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Login e Anúncios</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Conectar Wi-Fi" />
  <link rel="apple-touch-icon" href="icone.png" />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: #f0f0f0;
    }

    .container {
      width: 100%;
      max-width: 360px;
      margin: auto;
      padding: 20px;
      margin-top: 20vh;
      background: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 5px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    .error {
      color: red;
      font-size: 14px;
      text-align: left;
    }

    button {
      background: blue;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    .full-width {
      width: 100%;
    }

    button:disabled {
      background: gray;
      cursor: not-allowed;
    }

    .appbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #333;
      color: white;
      padding: 10px 16px;
      font-size: 18px;
    }

    .appbar button {
      width: 25%;
      padding: 6px 8px;
      font-size: 14px;
      height: auto;
    }

    #timerText {
      padding: 4px 6px;
    }


    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: calc(100vh - 50px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    #saibaMaisBtn {
      position: absolute;
      bottom: 10px;
      left: 5%;
      width: 90%;
      background-color: #28a745;
      color: white;
      font-size: 18px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }


    .hidden {
      display: none;
    }

    .feedback-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .check-circle {
      width: 100px;
      height: 100px;
      background-color: #4CAF50;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .check-icon {
      color: white;
      font-size: 48px;
    }

    .feedback-text {
      margin-top: 20px;
      font-size: 20px;
      color: #333;
    }
  </style>
</head>

<body>

  <div class="container" id="loginForm">
    <h2>Conecte-se</h2>
    <input type="text" id="name" placeholder="Nome e sobrenome" />
    <div class="error" id="nameError"></div>

    <!-- WhatsApp Ativo -->
    <input type="text" id="whatsapp" placeholder="Número do WhatsApp" maxlength="16" oninput="maskWhatsapp(this)">
    <div class="error" id="whatsappError"></div>

    <!-- E-mail Comentado -->
    <!-- 
    <input type="email" id="email" placeholder="E-mail">
    <div class="error" id="emailError"></div>
    -->

    <button class="full-width" onclick="validateAndProceed()">Conectar</button>
  </div>

  <div id="adContainer" class="hidden">
    <div class="appbar">
      <span id="timerText">Aguarde 5s</span>
      <button id="closeButton" class="hidden" onclick="nextAd()">Pular</button>
    </div>
    <div class="iframe-wrapper">
      <iframe id="adFrame" allow="autoplay"></iframe>
      <a id="saibaMaisBtn" href="#" target="_blank" class="hidden">Saiba mais</a>
    </div>
  </div>

  <div id="finalFeedback" class="hidden feedback-container">
    <div class="check-circle">
      <span class="check-icon">&#10003;</span>
    </div>
    <div class="feedback-text">Você está conectado</div>
  </div>

  <script>
    const links = [
      {
        url: 'https://drive.google.com/file/d/1ZfutuLB87VGA-CyQhGG-XOYbaNBZpWar/preview',
        link: 'https://onovomercado.com/'
      },
      {
        url: 'https://youtube.com/shorts/a1e1WaNKLSg',
        link: 'https://onovomercado.com/'
      },
      {
        url: 'https://drive.google.com/file/d/1KNET6sx-nT3ksXDuAZcQfoo1Z5K14hvi/preview',
        link: 'https://onovomercado.com/'
      },
    ];

    let currentAd = 0;
    let countdown = 5;
    let countdownInterval;

    function isYouTubeUrl(url) {
      return url.includes("youtube.com") || url.includes("youtu.be");
    }

    function getYouTubeEmbedUrl(url) {
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]+)/);
      return match
        ? `https://www.youtube.com/embed/${match[1]}?autoplay=1&controls=0&rel=0&modestbranding=1&playsinline=1`
        : null;
    }

    function maskWhatsapp(input) {
      let value = input.value.replace(/\D/g, '');
      if (value.length > 11) value = value.slice(0, 11);
      let formatted = '';
      if (value.length > 0) formatted = '(' + value.slice(0, 2);
      if (value.length >= 3) formatted += ') ' + value.slice(2, 7);
      if (value.length >= 8) formatted += '-' + value.slice(7);
      input.value = formatted;
    }


    function validateAndProceed() {
      const name = document.getElementById('name').value.trim();
      const whatsapp = document.getElementById('whatsapp').value.trim();
      // const email = document.getElementById('email').value.trim();

      const nameError = document.getElementById('nameError');
      const whatsappError = document.getElementById('whatsappError');
      // const emailError = document.getElementById('emailError');

      let isValid = true;
      const nameRegex = /^[A-Za-zÀ-ÖØ-öø-ÿ'\s-]+$/;
      const whatsappRegex = /^\(\d{2}\) \d{5}-\d{4}$/;
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!nameRegex.test(name) || name.length < 3) {
        nameError.innerText = "Nome inválido. Por favor informe seu nome e sobrenome.";
        isValid = false;
      } else {
        nameError.innerText = "";
      }

      // WhatsApp Ativo
      if (!whatsappRegex.test(whatsapp)) {
        whatsappError.innerText = "Número de WhatsApp inválido.";
        isValid = false;
      } else {
        whatsappError.innerText = "";
      }

      // E-mail Comentado
      /*
      if (!emailRegex.test(email)) {
        emailError.innerText = "E-mail inválido.";
        isValid = false;
      } else {
        emailError.innerText = "";
      }
      */

      if (isValid) {
        enterFullscreen();
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('adContainer').classList.remove('hidden');
        shuffleArray(links);
        loadAd();
      }
    }

    function enterFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) elem.requestFullscreen();
      else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      else if (elem.msRequestFullscreen) elem.msRequestFullscreen();

      setTimeout(() => window.scrollTo(0, 1), 100);
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function loadAd() {
      const adFrame = document.getElementById('adFrame');
      const timerText = document.getElementById('timerText');
      const closeButton = document.getElementById('closeButton');
      const saibaMaisBtn = document.getElementById('saibaMaisBtn');

      let ad = links[currentAd];
      let url = ad.url;


      if (url.endsWith('.pdf')) {
        url += '#toolbar=0&navpanes=0&scrollbar=0';
      }
      if (isYouTubeUrl(url)) {
        url = getYouTubeEmbedUrl(url);
      } else if (url.includes('/preview')) {
        url += '?rm=minimal#toolbar=0&navpanes=0&scrollbar=0';
      }

      adFrame.src = url;
      saibaMaisBtn.href = ad.link;
      saibaMaisBtn.classList.remove('hidden');
      saibaMaisBtn.style.visibility = 'visible';

      countdown = 5;
      closeButton.classList.add('hidden');
      timerText.textContent = `Aguarde ${countdown}s`;

      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        countdown--;
        if (countdown > 1) {
          timerText.textContent = `Aguarde ${countdown}s`;
        } else if (countdown === 1) {
          timerText.textContent = `Aguarde 1`;
        } else {
          clearInterval(countdownInterval);
          timerText.textContent = '';
          closeButton.classList.remove('hidden');
        }
      }, 1000);
    }

    function nextAd() {
      currentAd++;
      if (currentAd < links.length) {
        loadAd();
      } else {
        document.getElementById('adContainer').classList.add('hidden');
        document.getElementById('finalFeedback').classList.remove('hidden');
      }
    }
  </script>
</body>

</html>
