<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Login e Anúncios</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Conectar Wi-Fi" />
  <link rel="apple-touch-icon" href="icone.png" />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: #f0f0f0;
    }

    .container {
      width: 100%;
      max-width: 360px;
      margin: auto;
      padding: 20px;
      margin-top: 20vh;
      background: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 5px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    .error {
      color: red;
      font-size: 14px;
      text-align: left;
    }

    button {
      background: blue;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    .full-width {
      width: 100%;
    }

    button:disabled {
      background: gray;
      cursor: not-allowed;
    }

    .appbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #333;
      color: white;
      padding: 10px 16px;
      font-size: 18px;
    }

    .appbar button {
      width: 25%;
      padding: 6px 8px;
      font-size: 14px;
      height: auto;
      background: red;
    }

    #timerText {
      padding: 4px 6px;
    }

    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: calc(100vh - 50px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container" id="loginForm">
    <h2>Conecte-se</h2>
    <input type="text" id="name" placeholder="Nome e sobrenome" />
    <div class="error" id="nameError"></div>
    <button class="full-width" onclick="validateAndProceed()">Conectar</button>
  </div>

  <div id="adContainer" class="hidden">
    <div class="appbar">
      <span id="timerText">Aguarde 20s</span>
      <button id="closeButton" class="hidden" onclick="redirectToGoogle()">Fechar</button>
    </div>
    <div class="iframe-wrapper">
      <iframe id="adFrame" allow="autoplay"></iframe>
    </div>
  </div>

  <script>
    const links = [
      { url: 'https://youtube.com/shorts/I1xqkLM-VRk' }
    ];

    let currentAd = 0;
    let countdown = 20; // <<< Agora são 20 segundos
    let countdownInterval;

    function validateAndProceed() {
      const name = document.getElementById('name').value.trim();
      const nameError = document.getElementById('nameError');

      if (name.length < 3) {
        nameError.innerText = "Nome inválido.";
        return;
      } else {
        nameError.innerText = "";
      }

      enterFullscreen();
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('adContainer').classList.remove('hidden');
      loadAd();
    }

    function enterFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) elem.requestFullscreen();
      else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
      setTimeout(() => window.scrollTo(0, 1), 100);
    }

    function isYouTubeUrl(url) {
      return url.includes("youtube.com") || url.includes("youtu.be");
    }

    function getYouTubeEmbedUrl(url) {
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]+)/);
      return match
        ? `https://www.youtube.com/embed/${match[1]}?autoplay=1&controls=0&rel=0&modestbranding=1&playsinline=1`
        : null;
    }

    function loadAd() {
      const adFrame = document.getElementById('adFrame');
      const timerText = document.getElementById('timerText');
      const closeButton = document.getElementById('closeButton');

      let ad = links[currentAd];
      let url = ad.url;

      if (isYouTubeUrl(url)) {
        url = getYouTubeEmbedUrl(url);
      }

      adFrame.src = url;
      countdown = 20;
      closeButton.classList.add('hidden');
      timerText.textContent = `Aguarde ${countdown}s`;

      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        countdown--;
        if (countdown > 1) {
          timerText.textContent = `Aguarde ${countdown}s`;
        } else if (countdown === 1) {
          timerText.textContent = `Aguarde 1`;
        } else {
          clearInterval(countdownInterval);
          timerText.textContent = '';
          closeButton.classList.remove('hidden');
        }
      }, 1000);
    }

    function redirectToGoogle() {
      window.location.href = "https://www.instagram.com/prefeituradepedreiras_oficial";
    }
  </script>
</body>

</html>
